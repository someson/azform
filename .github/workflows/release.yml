name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest

      # Collect dependency license texts so they can ship inside the archives.
      # licenses/ is gitignored, so writing it leaves the tree clean.
      # THIRD_PARTY_LICENSES.md is tracked and must NOT be regenerated here:
      # goreleaser refuses to build from a dirty tree, which is exactly how
      # the first v0.1.1 attempt failed. It is verified instead, so a stale
      # file fails loudly rather than being silently rewritten mid-release.
      - name: bundle dependency licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0
          go-licenses save ./... --save_path=./licenses
          go-licenses report ./... > /tmp/third-party-licenses.md
          diff -u THIRD_PARTY_LICENSES.md /tmp/third-party-licenses.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is out of date; regenerate and commit it"
            exit 1
          }

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
