name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      # The pty end-to-end tests drive the real binary as a subprocess
      # and skip themselves when bin/azform is missing. Without this
      # step they silently skipped on every CI run — internal/ui
      # finished in ~1.4s instead of ~60s — so the widget round trip
      # was never actually exercised here.
      - name: build test binary
        run: make build

      # ubuntu-latest is the runner where every e2e prerequisite is
      # guaranteed: bash 5.x ships with the image and zsh is installed
      # here. That lets AZFORM_E2E_REQUIRED=1 below turn any skip into
      # a hard failure, so a green run means the tests really ran.
      #
      # macos-latest is deliberately left permissive: it ships bash
      # 3.2, which cannot run the bash widget at all, so the bash e2e
      # test must stay free to skip there.
      - name: install zsh (e2e prerequisite)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: test
        run: go test -race -count=1 ./...
        env:
          AZFORM_E2E_REQUIRED: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # install.sh is not covered by any Go test. A stray top-level
      # token here breaks the published install path under `set -eu`
      # while every other check stays green, so parse it explicitly.
      - name: install.sh syntax
        run: sh -n install.sh

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest

      # Fails the build if any dependency falls outside the allowlist.
      # Keep this list in sync with the table in the spec (section 14.5).
      - name: check dependency licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0

      # Catches a stale report on every push instead of at tag time. The
      # release job only verifies this file, so if it drifts here the release
      # is already broken — and a dependency bump is what makes it drift.
      - name: check THIRD_PARTY_LICENSES.md is current
        run: |
          go-licenses report ./... > /tmp/third-party-licenses.md
          diff -u THIRD_PARTY_LICENSES.md /tmp/third-party-licenses.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is out of date; run go-licenses report ./... > THIRD_PARTY_LICENSES.md and commit"
            exit 1
          }
